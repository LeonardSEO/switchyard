name: Release

# Publishing a GitHub release is the single release action. The tag and npm
# package version must match, preventing older version tags from being created
# on newer commits.
on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          root_version=$(node -p "require('./package.json').version")
          package_version=$(node -p "require('./packages/adapter-pi/package.json').version")
          test "$root_version" = "$package_version" || {
            echo "Root version $root_version does not match public package $package_version"
            exit 1
          }
          test "$RELEASE_TAG" = "v$package_version" || {
            echo "Release tag $RELEASE_TAG does not match @vepando/switchyard@$package_version"
            exit 1
          }

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm run pack:check

      - name: Publish @vepando/switchyard
        run: npm publish --workspace packages/adapter-pi --access public --provenance
